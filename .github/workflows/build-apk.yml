name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Prepare web folder
        run: |
          mkdir -p www

          find . -maxdepth 1 -type f -name "*.html" -exec cp {} www/ \;
          find . -maxdepth 1 -type f -name "*.css" -exec cp {} www/ \;
          find . -maxdepth 1 -type f -name "*.js" -exec cp {} www/ \;

          if [ -d "assets" ]; then
            cp -r assets www/
          fi

          if [ -d "images" ]; then
            cp -r images www/
          fi

          if [ ! -f "www/index.html" ]; then
            HTML_FILE=$(find www -maxdepth 1 -type f -name "*.html" | head -n 1)

            if [ -n "$HTML_FILE" ]; then
              cp "$HTML_FILE" www/index.html
            else
              echo "ERROR: No HTML file found"
              exit 1
            fi
          fi

      - name: Create Capacitor configuration
        run: |
          npx cap init "Hisab Kitab" "com.sujit.hisabkitab" --web-dir=www

      - name: Add Android
        run: |
          npx cap add android

      - name: Sync Android
        run: |
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hisab-Kitab-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
